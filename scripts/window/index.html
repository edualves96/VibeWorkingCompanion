<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival · VibeWorkCompanion</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d0e14;
    --chip: #1b1d27;
    --chip-edge: #2a2d3b;
    --text: #e6e3d8;
    --muted: #8a8798;
    --news: #ffd54a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font: 13px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  #hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; max-width: 96vw; }
  .chip { background: var(--chip); border: 1px solid var(--chip-edge); border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
  #scene { image-rendering: pixelated; image-rendering: crisp-edges; display: block; box-shadow: 0 0 0 1px var(--chip-edge); }
  .news { color: var(--news); min-height: 1.3em; text-align: center; max-width: 96vw; }
  .news.quiet { color: var(--muted); }
  #gone { display: none; color: var(--muted); }
  body.gone > :not(#gone) { display: none; }
  body.gone #gone { display: block; }
</style>
</head>
<body>
  <div id="hud"></div>
  <canvas id="scene" width="320" height="180"></canvas>
  <div id="news" class="news quiet"></div>
  <div id="gone">Survival is back in the status line. This window can be closed.</div>
  <script src="sprites.js"></script>
  <script src="scene.js"></script>
</body>
</html>
